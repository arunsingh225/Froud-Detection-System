name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/ai_engine/requirements-dev.txt
      - run: pip install -r src/ai_engine/requirements-dev.txt pip-audit
      - run: python -m pytest src/ai_engine/tests -q --cov=app --cov-report=term-missing --cov-report=xml:coverage-python.xml --cov-fail-under=85
        working-directory: .
      - uses: actions/upload-artifact@v4
        with: { name: python-coverage, path: coverage-python.xml }
      - run: pip-audit -r src/ai_engine/requirements.txt   # blocking: fails on any known vulnerability

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test src/backend/FraudGuard.Api.Tests --collect:"XPlat Code Coverage" --results-directory coverage
      - name: NuGet vulnerability gate
        run: |
          dotnet list src/backend/FraudGuard.Api package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "vulnerable NuGet packages found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: dotnet-coverage, path: coverage }

  # Runs the real SQL scripts (schema, seed, migrations) and the SQL Server integration tests that the
  # EF InMemory provider cannot cover (query translation, constraints, persistent token revocation).
  backend-sql:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "Ci_Str0ng!Passw0rd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Start SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs sql; exit 1
      - name: Apply schema, demo seed and migrations
        run: |
          docker cp src/backend/sql sql:/sql
          run_sql() { docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -b "$@"; }
          run_sql -i /sql/01_create_database_and_schema.sql
          run_sql -v ALLOW_DEMO_SEED=YES -i /sql/02_seed_demo_data.sql
          run_sql -i /sql/05_security_hardening_migration.sql   # idempotent upgrade scripts must be no-ops on a fresh schema
          run_sql -i /sql/06_alert_category.sql
          # the seed must be refused without the explicit opt-in
          if run_sql -i /sql/02_seed_demo_data.sql; then echo "seed ran without opt-in"; exit 1; fi
      - name: SQL Server integration tests
        env:
          FG_TEST_SQL: "Server=localhost,1433;Database=FraudGuardAI_DB;User Id=sa;Password=Ci_Str0ng!Passw0rd;TrustServerCertificate=True"
        run: dotnet test src/backend/FraudGuard.Api.Tests --filter "FullyQualifiedName~SqlServerIntegrationTests"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint (errors fail; the warning count may not grow beyond the current debt)
        run: npm run lint:ci
      - run: npm test
      - run: npm run build
      - name: npm audit (production dependencies, fail on critical)
        run: npm audit --omit=dev --audit-level=critical
      # Known: Angular 17 framework packages carry high-severity advisories whose fix is a major Angular upgrade.
      - name: npm audit (full tree, informational)
        run: npm audit || true

  # End-to-end smoke test of the real `docker compose up` stack: SQL Server + db-init, FastAPI engine, API, nginx/SPA.
  compose-smoke:
    runs-on: ubuntu-latest
    needs: [ai-engine, backend, backend-sql, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          printf '%s\n' \
            "JWT_SECRET_KEY=ci-only-jwt-signing-key-0123456789abcdef-xyz" \
            "FASTAPI_INTERNAL_SECRET=ci-only-internal-secret-0123456789" \
            "SQL_SA_PASSWORD=Ci_Str0ng!Passw0rd" \
            "SEED_DEMO_DATA=true" > .env
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/health > /dev/null && exit 0
            sleep 4
          done
          docker compose ps; docker compose logs --no-color | tail -150; exit 1
      - name: Smoke test (SPA, auth, CSRF, AI engine, revocation)
        run: bash scripts/ci/compose_smoke.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          # Also surface the tail of each service log as an annotation (readable without admin rights to the raw logs).
          for svc in db db-init ai-engine api web; do
            body=$(docker compose logs --no-color --tail 30 "$svc" 2>&1 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=compose logs: $svc::$body"
          done
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    needs: [ai-engine, backend, backend-sql, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/ai-engine.Dockerfile -t fraudguard-ai-engine .
      - run: docker build -f deploy/api.Dockerfile -t fraudguard-api .
      - run: docker build -f deploy/web.Dockerfile -t fraudguard-web .
