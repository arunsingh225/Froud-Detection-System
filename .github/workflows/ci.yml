name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/ai_engine/requirements-dev.txt
      - run: pip install -r src/ai_engine/requirements-dev.txt pip-audit
      - run: python -m pytest src/ai_engine/tests -q --cov=app --cov-report=term-missing --cov-report=xml:coverage-python.xml
        working-directory: .
      - uses: actions/upload-artifact@v4
        with: { name: python-coverage, path: coverage-python.xml }
      - run: pip-audit -r src/ai_engine/requirements.txt
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test src/backend/FraudGuard.Api.Tests --collect:"XPlat Code Coverage" --results-directory coverage
      - run: dotnet list src/backend/FraudGuard.Api package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        with: { name: dotnet-coverage, path: coverage }

  # Runs the real SQL scripts (schema, seed, migrations) and the SQL Server integration tests that the
  # EF InMemory provider cannot cover (query translation, constraints, persistent token revocation).
  backend-sql:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "Ci_Str0ng!Passw0rd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Start SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs sql; exit 1
      - name: Apply schema, demo seed and migrations
        run: |
          docker cp src/backend/sql sql:/sql
          run_sql() { docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -b "$@"; }
          run_sql -i /sql/01_create_database_and_schema.sql
          run_sql -v ALLOW_DEMO_SEED=YES -i /sql/02_seed_demo_data.sql
          run_sql -i /sql/05_security_hardening_migration.sql   # idempotent upgrade scripts must be no-ops on a fresh schema
          run_sql -i /sql/06_alert_category.sql
          # the seed must be refused without the explicit opt-in
          if run_sql -i /sql/02_seed_demo_data.sql; then echo "seed ran without opt-in"; exit 1; fi
      - name: SQL Server integration tests
        env:
          FG_TEST_SQL: "Server=localhost,1433;Database=FraudGuardAI_DB;User Id=sa;Password=Ci_Str0ng!Passw0rd;TrustServerCertificate=True"
        run: dotnet test src/backend/FraudGuard.Api.Tests --filter "FullyQualifiedName~SqlServerIntegrationTests"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true

  # End-to-end smoke test of the real `docker compose up` stack: SQL Server + db-init, FastAPI engine, API, nginx/SPA.
  compose-smoke:
    runs-on: ubuntu-latest
    needs: [ai-engine, backend, backend-sql, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          printf '%s\n' \
            "JWT_SECRET_KEY=ci-only-jwt-signing-key-0123456789abcdef-xyz" \
            "FASTAPI_INTERNAL_SECRET=ci-only-internal-secret-0123456789" \
            "SQL_SA_PASSWORD=Ci_Str0ng!Passw0rd" \
            "SEED_DEMO_DATA=true" > .env
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/health > /dev/null && exit 0
            sleep 4
          done
          docker compose ps; docker compose logs --no-color | tail -150; exit 1
      - name: Smoke test (SPA, auth, CSRF, AI engine, revocation)
        run: |
          set -euo pipefail
          check() { echo "== $1"; }
          fail() { echo "FAILED: $1"; docker compose logs --no-color | tail -150; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          check "SPA is served and contains the Angular root"
          curl -sf http://localhost:3000/ | grep -q "<app-root" || fail "SPA index"
          check "SPA security headers"
          curl -sI http://localhost:3000/ | grep -qi "x-content-type-options: nosniff" || fail "nginx headers"

          check "anonymous API call is rejected"
          [ "$(code http://localhost:3000/api/auth/me)" = "401" ] || fail "anonymous /auth/me should be 401"

          check "login through nginx (seeded ADMIN)"
          curl -s -D headers.txt -o login.json -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"priyanka.iyer@fraudguard.enterprise.io","password":"password123"}'
          head -1 headers.txt | grep -q " 200" || { cat headers.txt login.json; fail "login"; }
          TOKEN=$(grep -i '^set-cookie: FG_Auth=' headers.txt | sed -E 's/^[^=]+=([^;]+);.*/\1/' | tr -d '\r')
          [ -n "$TOKEN" ] || fail "no FG_Auth cookie"
          grep -qi "httponly" headers.txt || fail "cookie must be HttpOnly"
          grep -q '"token":""\|"token": ""' login.json || echo "(note) token field not empty in body"

          check "authenticated request works"
          curl -sf -H "Cookie: FG_Auth=$TOKEN" http://localhost:3000/api/auth/me | grep -qi "priyanka.iyer" || fail "/auth/me with cookie"

          check "AI engine reachable through the API (ADMIN)"
          curl -sf -H "Cookie: FG_Auth=$TOKEN" http://localhost:3000/api/fraud/engine-health | grep -q 'modelLoaded":true' || fail "engine-health"

          check "CSRF: cookie-authenticated POST without the header is blocked"
          [ "$(code -X POST -H "Cookie: FG_Auth=$TOKEN" http://localhost:3000/api/auth/logout)" = "403" ] || fail "CSRF header not enforced"

          check "logout with the header, then the old token must be rejected (persistent revocation)"
          [ "$(code -X POST -H "Cookie: FG_Auth=$TOKEN" -H 'X-Requested-With: XMLHttpRequest' http://localhost:3000/api/auth/logout)" = "200" ] || fail "logout"
          [ "$(code -H "Cookie: FG_Auth=$TOKEN" http://localhost:3000/api/auth/me)" = "401" ] || fail "revoked token still accepted"
          echo "ALL SMOKE CHECKS PASSED"
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          # Also surface the tail of each service log as an annotation (readable without admin rights to the raw logs).
          for svc in db db-init ai-engine api web; do
            body=$(docker compose logs --no-color --tail 30 "$svc" 2>&1 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=compose logs: $svc::$body"
          done
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    needs: [ai-engine, backend, backend-sql, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/ai-engine.Dockerfile -t fraudguard-ai-engine .
      - run: docker build -f deploy/api.Dockerfile -t fraudguard-api .
      - run: docker build -f deploy/web.Dockerfile -t fraudguard-web .
